AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EPR Copilot Backend Lambda Function

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  EprCopilotFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          AWS_LWA_PORT: "5000"
          PORT: "5000"
          AWS_REGION: "ap-south-1"
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: "*"
      Events:
        ApiEvent:
          Type: HttpApi

Parameters:
  BedrockModelId:
    Type: String
    Default: ""
    Description: Bedrock Model ID or Inference Profile ID
  GuardrailId:
    Type: String
    Default: ""
    Description: Amazon Bedrock Guardrail Identifier
  GuardrailVersion:
    Type: String
    Default: ""
    Description: Amazon Bedrock Guardrail Version

Outputs:
  EprCopilotApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
